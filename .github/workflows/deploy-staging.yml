name: Deploy staging

# Build in CI, run on the box: cp + web images build on GitHub runners and
# push to GHCR; the staging server only pulls the pinned sha tags and starts
# them (a 4GB host must never compile the stack itself). GHCR auth on the
# server uses this run's GITHUB_TOKEN over SSH, so private packages work with
# zero server-side setup.
#
# Required repo secret:
#   STAGING_SSH_KEY — private half of the dedicated CI deploy key installed
#   for deploy@159.195.215.228 (see /home/deploy/.ssh/authorized_keys).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  STAGING_HOST: 159.195.215.228
  STAGING_USER: deploy
  STAGING_DIR: /home/deploy/sigmahub
  CP_IMAGE_REPO: ghcr.io/strahinja-polovina/sigmahub-cp
  WEB_IMAGE_REPO: ghcr.io/strahinja-polovina/sigmahub-web

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push control plane
        uses: docker/build-push-action@v6
        with:
          context: cp
          push: true
          tags: |
            ${{ env.CP_IMAGE_REPO }}:${{ github.sha }}
            ${{ env.CP_IMAGE_REPO }}:latest
          cache-from: type=gha,scope=cp
          cache-to: type=gha,scope=cp,mode=max
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build & push dashboard
        uses: docker/build-push-action@v6
        with:
          context: web
          push: true
          tags: |
            ${{ env.WEB_IMAGE_REPO }}:${{ github.sha }}
            ${{ env.WEB_IMAGE_REPO }}:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pinned host key — no TOFU on the runner.
          echo "159.195.215.228 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHtZrueOK6f47D6QQ2tcHF5zyvJkcqHkwmw4mzOAOxjU" >> ~/.ssh/known_hosts

      - name: Sync deploy files
        run: |
          rsync -az --delete \
            --exclude '.git' \
            --exclude '.idea' \
            --exclude 'node_modules' \
            --exclude '.next' \
            --exclude 'cp/deploy/.env' \
            --exclude 'edge/' \
            ./ "$STAGING_USER@$STAGING_HOST:$STAGING_DIR/"

      - name: Pull pinned images & roll out
        run: |
          ssh "$STAGING_USER@$STAGING_HOST" \
            GHCR_TOKEN='${{ secrets.GITHUB_TOKEN }}' GHCR_USER='${{ github.actor }}' \
            CP_IMAGE="$CP_IMAGE_REPO:$GITHUB_SHA" WEB_IMAGE="$WEB_IMAGE_REPO:$GITHUB_SHA" \
            bash -s <<'EOS'
          set -euo pipefail
          cd /home/deploy/sigmahub/cp/deploy
          # Pin the freshly-built images in .env so ANY later `compose up`
          # (manual or CI) runs exactly this build; rollback = edit these lines.
          grep -v '^CP_IMAGE=\|^WEB_IMAGE=' .env > .env.new && mv .env.new .env
          printf 'CP_IMAGE=%s\nWEB_IMAGE=%s\n' "$CP_IMAGE" "$WEB_IMAGE" >> .env
          chmod 600 .env
          # This run's GITHUB_TOKEN authorizes the pull (works while the job
          # lives — exactly when the pull happens).
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          cd /home/deploy/sigmahub
          docker compose -f cp/deploy/docker-compose.yml pull cp web
          docker compose -f cp/deploy/docker-compose.yml up -d
          docker logout ghcr.io >/dev/null || true
          docker image prune -f >/dev/null
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/readyz >/dev/null && { echo "cp ready"; break; }
            [ "$i" = 30 ] && { echo "cp not ready after rollout" >&2; exit 1; }
            sleep 2
          done
          curl -sf -o /dev/null http://localhost:3000/ && echo "web ready"
          EOS
