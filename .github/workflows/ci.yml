name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: web (lint · typecheck · test · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from web/package.json "packageManager" — one pin
      # shared by CI, the Docker build (corepack) and local corepack setups.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
      - run: pnpm build

  cp:
    name: cp (vet · test · build)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    defaults:
      run:
        working-directory: cp
    # Postgres for the CP+agent integration harness (P1-2); only the native
    # linux/amd64 leg runs tests against it.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sigmahub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cp/go.mod
          cache-dependency-path: cp/go.sum
      # vet + test only make sense on the native runner (linux/amd64); the
      # other matrix legs cross-compile to prove the build. The integration
      # test runs against the postgres service via CP_TEST_DATABASE_URL.
      - name: Vet & test
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        env:
          CP_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/sigmahub_test
        run: |
          go vet ./...
          go test -race ./...
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build ./...

  agent-k8s-e2e:
    name: agent (real Kubernetes API server)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    # The manifests the agent writes are hand-rolled YAML — deliberately, so the
    # binary stays static and dependency-free — which means nothing in the type
    # system says the output is valid. One wrong indentation level and every
    # cluster deploy fails at the API server while the product reports a
    # successful apply. So a real control plane validates them.
    #
    # `k3s server --disable-agent` is an API server, scheduler and controller
    # manager with no kubelet: it pulls no images and schedules no pods, which is
    # what makes this cheap enough to run on every PR.
    env:
      K3S_VERSION: v1.31.4+k3s1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: Start a k3s control plane
        run: |
          set -euo pipefail
          curl -sfL -o /tmp/k3s \
            "https://github.com/k3s-io/k3s/releases/download/${K3S_VERSION/+/%2B}/k3s"
          chmod +x /tmp/k3s
          sudo mkdir -p /tmp/k3sdata
          # 0644 on the kubeconfig: k3s must run as root, the test does not.
          sudo /tmp/k3s server --disable-agent --disable traefik \
            --data-dir /tmp/k3sdata \
            --write-kubeconfig /tmp/k3sdata/kubeconfig \
            --write-kubeconfig-mode 0644 \
            --bind-address 127.0.0.1 > /tmp/k3s-server.log 2>&1 &
          for _ in $(seq 1 60); do
            if sudo /tmp/k3s kubectl --kubeconfig /tmp/k3sdata/kubeconfig \
                 version -o json >/dev/null 2>&1; then
              echo "API server up"; exit 0
            fi
            sleep 2
          done
          echo "API server did not come up:"; tail -50 /tmp/k3s-server.log; exit 1
      - name: Kubernetes manifest e2e
        env:
          SIGMAD_K8S_E2E: "1"
          KUBECONFIG: /tmp/k3sdata/kubeconfig
          SIGMAD_KUBECTL: /tmp/k3s
        run: go test ./internal/k8s/ -run TestK8sE2E -v
      - name: k3s server log on failure
        if: failure()
        run: tail -100 /tmp/k3s-server.log

  agent:
    name: agent (vet · test · build)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: Vet & test
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          go vet ./...
          go test -race ./...
      # The real-Docker container-runtime e2e (P1-3, extended by P1-6): the
      # ubuntu-latest runner has Docker preinstalled, so run the driver against
      # it. Gated by SIGMAD_DOCKER_E2E so `go test ./...` above (and local runs)
      # skip it. Run as ROOT: sigmad runs as root in production, and the P1-6
      # secrets test seeds file-mode secrets into a container's tmpfs by writing
      # through /proc/<pid>/root, which requires root (or CAP_SYS_PTRACE) on the
      # target process. Isolated GOCACHE/GOMODCACHE keep root out of the
      # runner-owned Go caches so later runner steps still write theirs.
      - name: Docker runtime e2e (root)
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          GP="$(go env GOPROXY)"; GS="$(go env GOSUMDB)"; GO="$(command -v go)"
          sudo env SIGMAD_DOCKER_E2E=1 \
                   GOCACHE=/tmp/e2e-gocache GOMODCACHE=/tmp/e2e-gomod \
                   GOFLAGS=-mod=mod GOPROXY="$GP" GOSUMDB="$GS" \
                   "$GO" test ./internal/container/ -run TestDockerE2E -v
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build ./...
