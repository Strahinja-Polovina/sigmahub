name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub release + upload assets
  id-token: write # keyless cosign signing via GitHub OIDC

jobs:
  # A tag on a broken commit must not ship: the release gates on the same
  # vet+test (with the race detector and the Postgres-backed integration
  # suite) that branch CI runs.
  test:
    name: test before release
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sigmahub_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cp/go.mod
      - name: cp vet & test
        working-directory: cp
        env:
          CP_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/sigmahub_test
        run: |
          go vet ./...
          go test -race ./...
      - name: agent vet & test
        working-directory: agent
        run: |
          go vet ./...
          go test -race ./...

  release:
    name: goreleaser (sign + SBOM) & verify
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Both modules pin the same Go version; read it from cp/go.mod.
      - uses: actions/setup-go@v5
        with:
          go-version-file: cp/go.mod

      - uses: anchore/sbom-action/download-syft@v0
      - uses: sigstore/cosign-installer@v3

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Verify the pipeline's own signature over the checksums file, then check
      # every archive against those verified checksums. If verify-blob fails the
      # release job fails — a tag can't publish artifacts that don't verify.
      - name: Verify signatures
        run: |
          set -euo pipefail
          cd dist
          echo "::group::cosign verify-blob checksums.txt"
          cosign verify-blob \
            --certificate checksums.txt.pem \
            --signature checksums.txt.sig \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/release\.yml@" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            checksums.txt
          echo "::endgroup::"
          echo "::group::sha256sum -c checksums.txt"
          # checksum.extra_files (install.sh, sigmad.service, sigmahub-cp.service)
          # are hashed at their source paths and listed in checksums.txt by
          # basename, but goreleaser does not copy them into dist/ — so
          # `sha256sum -c` here could not read them and the step failed on every
          # tag, making the integrity gate a no-op (SIGMA-156). Stage them next
          # to the archives so the FULL checksums.txt (archives + packaging
          # files) actually verifies.
          cp ../agent/packaging/install.sh \
             ../agent/packaging/sigmad.service \
             ../cp/packaging/sigmahub-cp.service \
             .
          sha256sum -c checksums.txt
          echo "::endgroup::"
