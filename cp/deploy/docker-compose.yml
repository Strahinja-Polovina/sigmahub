# Production self-hosting for the full SigmaHub stack: control plane +
# dashboard + PostgreSQL 16. Copy .env.example to .env and fill in the
# secrets first.
#
#   docker compose -f cp/deploy/docker-compose.yml up -d
#
# Key custody: default is the file backend — the key is generated on first
# boot inside the cp-data volume; BACK IT UP (every wrapped secret depends on
# it). For production set CP_KMS_BACKEND=vault + CP_VAULT_* instead.
services:
  db:
    image: postgres:16.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sigmahub
      POSTGRES_PASSWORD: ${CP_DB_PASSWORD:?set CP_DB_PASSWORD in .env}
      POSTGRES_DB: sigmahub
    volumes:
      - db-data:/var/lib/postgresql/data
      # Creates the dashboard's own database (sigmahub_web) on first boot.
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sigmahub -d sigmahub"]
      interval: 5s
      timeout: 3s
      retries: 12

  cp:
    build:
      context: ..
      dockerfile: Dockerfile
    # CI deploys pin a prebuilt registry image (CP_IMAGE=ghcr.io/…:<sha>);
    # the default keeps the self-hosted `docker compose build` flow working.
    image: ${CP_IMAGE:-sigmahub-cp:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      CP_ENV: prod
      CP_ADDR: ":8080"
      CP_DATABASE_URL: postgres://sigmahub:${CP_DB_PASSWORD}@db:5432/sigmahub
      CP_KMS_KEY_FILE: /data/cp-kms.key
      CP_PROVISION_TOKEN: ${CP_PROVISION_TOKEN:?set CP_PROVISION_TOKEN in .env}
      CP_GITHUB_WEBHOOK_SECRET: ${CP_GITHUB_WEBHOOK_SECRET:-}
      # CP's own public base URL (e.g. https://cp.example.com). With the
      # webhook secret set, connecting a repo auto-registers its push webhook.
      CP_PUBLIC_URL: ${CP_PUBLIC_URL:-}
      # The agent installer the control plane serves (SIGMA-217). The host being
      # onboarded fetches install.sh and every release asset from the CP, which
      # fetches them from GitHub with the token below — so a PRIVATE release
      # repository can be onboarded from without the credential ever appearing
      # in the command an operator pastes into a root shell.
      #
      # Both are OPTIONAL: empty repo falls through to the upstream slug, and
      # empty token means an unauthenticated fetch, which is what a public
      # release wants (GitHub's anonymous REST API allows 60 requests an hour
      # and one onboarding costs six). A self-hoster with a private fork sets
      # both.
      CP_RELEASE_REPO: ${CP_RELEASE_REPO:-}
      CP_RELEASE_TOKEN: ${CP_RELEASE_TOKEN:-}
      # Which release the CP installs. This is the ONLY place the version is
      # configured: the dashboard no longer has a setting of its own, it asks the
      # control plane and renders the answer, so there is nothing here for a
      # second key to disagree with. Unset falls back to the release this
      # control-plane binary was built from, which is already correct for a
      # released image (goreleaser stamps cp and sigmad from one tag) and is
      # "dev" for a source build — onboarding then refuses, naming this setting.
      CP_AGENT_VERSION: ${SIGMAHUB_AGENT_VERSION:-}
      # Hugging Face account the control plane acts as (SIGMA-213/214, optional).
      # One setting doing both halves of the LLM path: it authenticates the
      # model picker's Hub calls, and it is seeded into each inference
      # endpoint's HUGGING_FACE_HUB_TOKEN so the agent downloads weights as the
      # same account. Empty is supported — public models search and download
      # unauthenticated — but then a gated repo (Llama & co) is invisible to the
      # picker. Missing here entirely was worse than empty: the key could be set
      # in .env and never reach the process.
      CP_HUGGING_FACE_TOKEN: ${CP_HUGGING_FACE_TOKEN:-}
      # GitHub App (SIGMA-55, optional): installation tokens instead of PATs.
      # Drop the downloaded PEM next to this file as github-app.pem and
      # uncomment the volume below; the key is imported into KMS custody on
      # first boot, after which the file can be removed.
      CP_GITHUB_APP_ID: ${CP_GITHUB_APP_ID:-}
      CP_GITHUB_APP_SLUG: ${CP_GITHUB_APP_SLUG:-}
      CP_GITHUB_APP_PRIVATE_KEY_FILE: ${CP_GITHUB_APP_PRIVATE_KEY_FILE:-}
      CP_ACME_EMAIL: ${CP_ACME_EMAIL:-}
      # Overrides the ACME directory for managed-domain TLS (P1-8). Empty means
      # Let's Encrypt production; point it at LE staging or Pebble on a staging
      # box, whose repeated bring-ups would otherwise spend the real CA's
      # per-domain issuance budget.
      CP_ACME_CA_DIR_URL: ${CP_ACME_CA_DIR_URL:-}
      CP_DB_ENGINES: ${CP_DB_ENGINES:-postgres,mysql,redis,mongodb}
      # Object-storage engines (P2-2). MinIO-only build: CP_S3_ENGINES=minio.
      CP_S3_ENGINES: ${CP_S3_ENGINES:-minio,seaweedfs}
      # Key custody (P0-9): file (dev default) or vault (production).
      CP_KMS_BACKEND: ${CP_KMS_BACKEND:-file}
      CP_VAULT_ADDR: ${CP_VAULT_ADDR:-}
      CP_VAULT_TOKEN: ${CP_VAULT_TOKEN:-}
      CP_VAULT_TRANSIT_KEY: ${CP_VAULT_TRANSIT_KEY:-sigmahub-cp}
      # P1-13 telemetry sinks (optional; empty = pipeline off, UI shows it).
      CP_VM_WRITE_URL: ${CP_VM_WRITE_URL:-}
      CP_VM_READ_URL: ${CP_VM_READ_URL:-}
      CP_LOKI_URL: ${CP_LOKI_URL:-}
      # How long server_metrics rows are kept, and (with no pipeline) how far
      # back GET .../metrics will serve — one setting so the two agree.
      CP_METRICS_RETENTION: ${CP_METRICS_RETENTION:-24h}
      # Billing (P2-4, Paddle; optional). Empty = billing off (usage preview).
      CP_PADDLE_API_KEY: ${CP_PADDLE_API_KEY:-}
      CP_PADDLE_WEBHOOK_SECRET: ${CP_PADDLE_WEBHOOK_SECRET:-}
      CP_PADDLE_ENV: ${CP_PADDLE_ENV:-sandbox}
      CP_PADDLE_PRICE_ID: ${CP_PADDLE_PRICE_ID:-}
    volumes:
      - cp-data:/data
      # GitHub App key import (set CP_GITHUB_APP_PRIVATE_KEY_FILE=/data/github-app.pem):
      # - ./github-app.pem:/data/github-app.pem:ro
    ports:
      - "8080:8080"

  web:
    build:
      context: ../../web
      dockerfile: Dockerfile
    image: ${WEB_IMAGE:-sigmahub-web:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      cp:
        condition: service_started
    environment:
      DATABASE_URL: postgres://sigmahub:${CP_DB_PASSWORD}@db:5432/sigmahub_web
      # In-cluster URL the dashboard uses to call the control plane.
      SIGMAHUB_CP_URL: http://cp:8080
      # Public URL a BYO host dials to reach the CP — must be reachable from
      # outside the compose network (http://cp:8080 is not). Rendered into the
      # agent install command; without it onboarding prints an unusable endpoint
      # (SIGMA-157).
      SIGMAHUB_CP_PUBLIC_URL: ${SIGMAHUB_CP_PUBLIC_URL:?set SIGMAHUB_CP_PUBLIC_URL in .env}
      # No agent version here on purpose. The dashboard renders the install
      # command around the version the control plane hands back with the
      # bootstrap token, so a setting on this side would be a second opinion
      # about which release gets installed — and the losing half of that
      # disagreement is a host that fetches one release's installer and asks it
      # to install another. See CP_AGENT_VERSION on the cp service.
      SIGMAHUB_CP_PROVISION_TOKEN: ${CP_PROVISION_TOKEN}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${WEB_PUBLIC_URL:-http://localhost:3000}
    ports:
      - "3000:3000"

  # ── Telemetry sinks (optional; enable with COMPOSE_PROFILES=telemetry) ──────
  # Gives the dashboard real resource logs (Loki) and metrics (VictoriaMetrics
  # cluster — the CP's tenant-scoped /insert/<t>/… and /select/<t>/… paths need
  # the cluster layout, not the single binary). Wire the CP at them with:
  #   CP_LOKI_URL=http://loki:3100
  #   CP_VM_WRITE_URL=http://vminsert:8480
  #   CP_VM_READ_URL=http://vmselect:8481
  loki:
    image: grafana/loki:2.9.8
    profiles: ["telemetry"]
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - loki-data:/loki

  vmstorage:
    image: victoriametrics/vmstorage:v1.102.1-cluster
    profiles: ["telemetry"]
    restart: unless-stopped
    command: ["-storageDataPath=/storage"]
    volumes:
      - vm-data:/storage

  vminsert:
    image: victoriametrics/vminsert:v1.102.1-cluster
    profiles: ["telemetry"]
    restart: unless-stopped
    command: ["-storageNode=vmstorage:8400"]
    depends_on:
      - vmstorage

  vmselect:
    image: victoriametrics/vmselect:v1.102.1-cluster
    profiles: ["telemetry"]
    restart: unless-stopped
    command: ["-storageNode=vmstorage:8401"]
    depends_on:
      - vmstorage

volumes:
  db-data:
  cp-data:
  loki-data:
  vm-data:
