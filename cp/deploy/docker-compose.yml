# Production self-hosting for the full SigmaHub stack: control plane +
# dashboard + PostgreSQL 16. Copy .env.example to .env and fill in the
# secrets first.
#
#   docker compose -f cp/deploy/docker-compose.yml up -d
#
# Key custody: default is the file backend — the key is generated on first
# boot inside the cp-data volume; BACK IT UP (every wrapped secret depends on
# it). For production set CP_KMS_BACKEND=vault + CP_VAULT_* instead.

# Bounded container logs (SIGMA-254). Every service below is restarted forever,
# and the control plane writes one structured line per HTTP request — dominated
# by agent long-polls, heartbeats and telemetry pushes, so a fleet of any size
# produces a steady few lines a second, indefinitely. Docker's json-file driver
# has NO size limit unless one is asked for, and that file lives on the same
# filesystem as the db-data and cp-data volumes on the small host this stack
# targets. Left uncapped the eventual failure is not "the logs got big": it is
# Postgres unable to write WAL, which reads like a database fault, on a box
# whose first diagnostic (`docker compose logs`) is the thing that ate the disk.
#
# This belongs here rather than in the host's /etc/docker/daemon.json because
# the compose file is what a self-hoster copies; the daemon config is what they
# never touch. 10m x 3 caps each service at 30MB of rotated history, which is
# still hours of request log — enough to debug the incident that sent the
# operator looking. Ship logs off-box (CP_LOKI_URL, or a compose-level logging
# driver) if you need more retention than that.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16.6-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: sigmahub
      POSTGRES_PASSWORD: ${CP_DB_PASSWORD:?set CP_DB_PASSWORD in .env}
      POSTGRES_DB: sigmahub
    volumes:
      - db-data:/var/lib/postgresql/data
      # Creates the dashboard's own database (sigmahub_web) on first boot.
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sigmahub -d sigmahub"]
      interval: 5s
      timeout: 3s
      retries: 12

  cp:
    build:
      context: ..
      dockerfile: Dockerfile
    # CI deploys pin a prebuilt registry image (CP_IMAGE=ghcr.io/…:<sha>);
    # the default keeps the self-hosted `docker compose build` flow working.
    image: ${CP_IMAGE:-sigmahub-cp:latest}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      CP_ENV: prod
      CP_ADDR: ":8080"
      CP_DATABASE_URL: postgres://sigmahub:${CP_DB_PASSWORD}@db:5432/sigmahub
      CP_KMS_KEY_FILE: /data/cp-kms.key
      CP_PROVISION_TOKEN: ${CP_PROVISION_TOKEN:?set CP_PROVISION_TOKEN in .env}
      CP_GITHUB_WEBHOOK_SECRET: ${CP_GITHUB_WEBHOOK_SECRET:-}
      # CP's own public base URL (e.g. https://cp.example.com). With the
      # webhook secret set, connecting a repo auto-registers its push webhook.
      #
      # It falls back to SIGMAHUB_CP_PUBLIC_URL, which is required below,
      # because the two are the same fact — the address this control plane
      # answers on from outside — under two names, and only one of them is
      # mandatory. Left independently empty, the control plane does not know its
      # own scheme, and so cannot notice that the installer it is about to hand
      # a host would travel in the clear (SIGMA-266).
      CP_PUBLIC_URL: ${CP_PUBLIC_URL:-${SIGMAHUB_CP_PUBLIC_URL}}
      # The agent installer the control plane serves (SIGMA-217). The host being
      # onboarded fetches install.sh and every release asset from the CP, which
      # fetches them from GitHub with the token below — so a PRIVATE release
      # repository can be onboarded from without the credential ever appearing
      # in the command an operator pastes into a root shell.
      #
      # Both are OPTIONAL: empty repo falls through to the upstream slug, and
      # empty token means an unauthenticated fetch, which is what a public
      # release wants (GitHub's anonymous REST API allows 60 requests an hour
      # and one onboarding costs six). Leave the repo empty — it may only name
      # the repository install.sh cosign-verifies against, and the control plane
      # refuses to boot with any other value; see cp/deploy/.env.example.
      CP_RELEASE_REPO: ${CP_RELEASE_REPO:-}
      CP_RELEASE_TOKEN: ${CP_RELEASE_TOKEN:-}
      # Which release the CP installs. This is the ONLY place the version is
      # configured: the dashboard no longer has a setting of its own, it asks the
      # control plane and renders the answer, so there is nothing here for a
      # second key to disagree with. Unset falls back to the release this
      # control-plane binary was built from, which is already correct for a
      # released image (goreleaser stamps cp and sigmad from one tag) and is
      # "dev" for a source build — onboarding then refuses, naming this setting.
      #
      # And it must be read from the name that refusal PRINTS (SIGMA-269). This
      # line said ${SIGMAHUB_AGENT_VERSION:-} while the sentence the dashboard
      # shows says "Set CP_AGENT_VERSION to a released tag such as v0.3.0", so a
      # self-hoster on a source build did exactly what the product told them,
      # restarted, and got the identical refusal — the fix had been applied to a
      # key nothing read.
      CP_AGENT_VERSION: ${CP_AGENT_VERSION:-}
      # Hugging Face account the CONTROL PLANE acts as (SIGMA-213/214, optional).
      # It authenticates the model picker's own Hub metadata calls and nothing
      # else: it is no longer seeded into tenants' inference endpoints, because
      # that put one operator-owned credential into containers on hosts the
      # customers own and can read (SIGMA-302). A tenant needing gated weights
      # supplies their own HUGGING_FACE_HUB_TOKEN project secret. Empty is
      # supported — public models search unauthenticated — but then a gated repo
      # (Llama & co) is invisible to the picker. Missing here entirely was worse
      # than empty: the key could be set in .env and never reach the process.
      CP_HUGGING_FACE_TOKEN: ${CP_HUGGING_FACE_TOKEN:-}
      # The wildcard resource URLs are minted under (SIGMA-351, optional). Set it
      # to e.g. apps.example.com with *.apps.example.com pointed at the proxy
      # servers, and every resource gets <label>.apps.example.com routed and
      # certified without the customer owning a domain at all.
      #
      # Empty is fully supported and falls back to sslip.io derived from each
      # host's public address, which needs no DNS record anywhere — that is what
      # makes a fresh install reachable on its FIRST deploy instead of after a
      # domain purchase. Set this for a hosted product, where clean hostnames and
      # a certificate you control are worth the record.
      CP_APPS_DOMAIN: ${CP_APPS_DOMAIN:-}
      # GitHub App (SIGMA-55, optional): installation tokens instead of PATs.
      # Drop the downloaded PEM next to this file as github-app.pem and
      # uncomment the volume below; the key is imported into KMS custody on
      # first boot, after which the file can be removed.
      CP_GITHUB_APP_ID: ${CP_GITHUB_APP_ID:-}
      CP_GITHUB_APP_SLUG: ${CP_GITHUB_APP_SLUG:-}
      CP_GITHUB_APP_PRIVATE_KEY_FILE: ${CP_GITHUB_APP_PRIVATE_KEY_FILE:-}
      CP_ACME_EMAIL: ${CP_ACME_EMAIL:-}
      # Overrides the ACME directory for managed-domain TLS (P1-8). Empty means
      # Let's Encrypt production; point it at LE staging or Pebble on a staging
      # box, whose repeated bring-ups would otherwise spend the real CA's
      # per-domain issuance budget.
      CP_ACME_CA_DIR_URL: ${CP_ACME_CA_DIR_URL:-}
      # Engine allowlists (P1-10, P2-2), deliberately WITHOUT a default value
      # (SIGMA-268). Empty means "every engine the Go catalog defines", derived
      # in config.go from store.DBEngineKinds()/store.S3EngineNames(). Writing
      # the names here instead pinned every deployment built from this file to
      # the engines that existed the day the line was typed: add a fifth kind to
      # the catalog and the wizard offers it (it reads the generated catalog)
      # while the control plane 422s it at submit time, after the dialog has
      # closed. Set them only to CUT the list — a Postgres-only build is
      # CP_DB_ENGINES=postgres, a MinIO-only one CP_S3_ENGINES=minio — and a
      # name the catalog does not know fails boot rather than disappearing.
      CP_DB_ENGINES: ${CP_DB_ENGINES:-}
      CP_S3_ENGINES: ${CP_S3_ENGINES:-}
      # Key custody (P0-9): file (dev default) or vault (production).
      CP_KMS_BACKEND: ${CP_KMS_BACKEND:-file}
      CP_VAULT_ADDR: ${CP_VAULT_ADDR:-}
      CP_VAULT_TOKEN: ${CP_VAULT_TOKEN:-}
      CP_VAULT_TRANSIT_KEY: ${CP_VAULT_TRANSIT_KEY:-sigmahub-cp}
      # Vault Enterprise namespace (empty = root). It was missing here while
      # main.go read it (SIGMA-270), and a missing namespace does not present as
      # "the setting had no effect": every wrap/unwrap goes to the ROOT
      # namespace instead, so a fresh install dies on the DSD signing key and an
      # upgrade stops unwrapping the pepper and the per-org DEKs — stored
      # secrets unreadable, with nothing naming a namespace as the cause.
      CP_VAULT_NAMESPACE: ${CP_VAULT_NAMESPACE:-}
      # Make the X-Sigmahub-Actor header mandatory on org-scoped service tokens
      # (SIGMA-82). Off by default; an operator who provisions per-role tokens
      # turns it on to fail closed. It was in neither this file nor
      # .env.example, which made a shipped security control undiscoverable.
      CP_REQUIRE_ACTOR: ${CP_REQUIRE_ACTOR:-}
      # P1-13 telemetry sinks (optional; empty = pipeline off, UI shows it).
      CP_VM_WRITE_URL: ${CP_VM_WRITE_URL:-}
      CP_VM_READ_URL: ${CP_VM_READ_URL:-}
      CP_LOKI_URL: ${CP_LOKI_URL:-}
      # How long server_metrics rows are kept, and (with no pipeline) how far
      # back GET .../metrics will serve — one setting so the two agree.
      CP_METRICS_RETENTION: ${CP_METRICS_RETENTION:-24h}
      # Billing (P2-4, Paddle; optional). Empty = billing off (usage preview).
      CP_PADDLE_API_KEY: ${CP_PADDLE_API_KEY:-}
      CP_PADDLE_WEBHOOK_SECRET: ${CP_PADDLE_WEBHOOK_SECRET:-}
      CP_PADDLE_ENV: ${CP_PADDLE_ENV:-sandbox}
      CP_PADDLE_PRICE_ID: ${CP_PADDLE_PRICE_ID:-}
    volumes:
      - cp-data:/data
      # GitHub App key import (set CP_GITHUB_APP_PRIVATE_KEY_FILE=/data/github-app.pem):
      # - ./github-app.pem:/data/github-app.pem:ro
    # LOOPBACK ONLY (SIGMA-266). Everything from outside the box arrives through
    # the `proxy` service below, which terminates TLS; this binding exists so the
    # operator (and the staging rollout's post-deploy poll) can curl /readyz from
    # the host itself without going through DNS and a certificate. Published on
    # 0.0.0.0 it was the plaintext endpoint an operator inevitably named in
    # SIGMAHUB_CP_PUBLIC_URL to make the runbook work, which is how the install
    # command stops being a signed-artifact story and starts being an
    # unauthenticated script piped into `sudo bash`.
    ports:
      - "127.0.0.1:8080:8080"

  web:
    build:
      context: ../../web
      dockerfile: Dockerfile
    image: ${WEB_IMAGE:-sigmahub-web:latest}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
      cp:
        condition: service_started
    environment:
      DATABASE_URL: postgres://sigmahub:${CP_DB_PASSWORD}@db:5432/sigmahub_web
      # In-cluster URL the dashboard uses to call the control plane.
      SIGMAHUB_CP_URL: http://cp:8080
      # Public URL a BYO host dials to reach the CP — must be reachable from
      # outside the compose network (http://cp:8080 is not). Rendered into the
      # agent install command; without it onboarding prints an unusable endpoint
      # (SIGMA-157).
      SIGMAHUB_CP_PUBLIC_URL: ${SIGMAHUB_CP_PUBLIC_URL:?set SIGMAHUB_CP_PUBLIC_URL in .env}
      # No agent version here on purpose. The dashboard renders the install
      # command around the version the control plane hands back with the
      # bootstrap token, so a setting on this side would be a second opinion
      # about which release gets installed — and the losing half of that
      # disagreement is a host that fetches one release's installer and asks it
      # to install another. See CP_AGENT_VERSION on the cp service.
      SIGMAHUB_CP_PROVISION_TOKEN: ${CP_PROVISION_TOKEN}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${WEB_PUBLIC_URL:-http://localhost:3000}
      # Block sign-in until the address is verified (SIGMA-82/SIGMA-261).
      #
      # Deliberately passed through EMPTY rather than defaulted here: empty means
      # "let the web tier decide", and it decides by whether mail can actually be
      # delivered (SIGMA-365). With SMTP wired below, verification is ON — invite
      # acceptance, audit rows and the whole "email is identity" assumption rest
      # on it. Without a transport it stays off, because a verification link that
      # only reaches the container log would strand every sign-up. Hard-coding
      # `false` here, as this line used to, silently overrode that judgement.
      # Parsed strictly on the web side: an unrecognised value fails the
      # container's boot instead of leaving the control quietly off.
      AUTH_REQUIRE_EMAIL_VERIFICATION: ${AUTH_REQUIRE_EMAIL_VERIFICATION:-}
      # Outbound mail (SIGMA-361/365). Set SMTP_HOST + SMTP_FROM and the product
      # starts delivering invites, verification and password resets for real;
      # leave them unset and every one of those links goes to this container's
      # log instead, with the UI saying so rather than pointing users at a spam
      # folder that will never fill. Public sign-up should not be opened until
      # these are set — a locked-out user cannot ask anyone to relay a link.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      # Escape hatch for a submission server on a trusted network that offers no
      # STARTTLS. Off by default: these messages carry bearer links.
      SMTP_ALLOW_INSECURE: ${SMTP_ALLOW_INSECURE:-}
      # Optional shared secret for GET /api/health?require=cp, the deploy gate
      # that round-trips to the control plane. Unset leaves it open, as it was.
      HEALTH_PROBE_TOKEN: ${HEALTH_PROBE_TOKEN:-}
    # Loopback only, for the same reason as cp above: the dashboard is reached
    # through the proxy, and this binding is for on-box checks.
    ports:
      - "127.0.0.1:3000:3000"

  # ── TLS terminator (SIGMA-266) ─────────────────────────────────────────────
  # The one thing published to the world, and the reason the https URLs the rest
  # of this file requires actually answer.
  #
  # This stack used to publish 8080 and 3000 in plaintext with nothing in front
  # of them, while .env.example told the operator that SIGMAHUB_CP_PUBLIC_URL
  # MUST be https — so either the documented URL connected to nothing, or the
  # operator named the http one and every onboarded host executed a script
  # fetched in the clear, with a one-time bootstrap token in the query string.
  # install.sh is the single artifact cosign cannot cover (it is what runs
  # cosign), so that was not a hardening nicety: it was the product's stated
  # trust boundary, removed to make the runbook work.
  #
  # Caddy provisions and renews certificates over ACME by itself, keyed on the
  # site addresses in ./Caddyfile — which are the SIGMAHUB_CP_PUBLIC_URL and
  # WEB_PUBLIC_URL already in .env rather than two more hostname settings to
  # keep in step. Ports 80 and 443 must both be reachable: 80 is the HTTP-01
  # challenge and the redirect to https.
  proxy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - cp
      - web
    environment:
      SIGMAHUB_CP_PUBLIC_URL: ${SIGMAHUB_CP_PUBLIC_URL:?set SIGMAHUB_CP_PUBLIC_URL in .env}
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:-http://localhost:3000}
      CP_ACME_EMAIL: ${CP_ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Issued certificates and ACME account keys. BACK THIS UP or at least do
      # not wipe it casually: a `down -v` throws away the account and every
      # certificate, and a rebuild re-issues from the CA — which has per-domain
      # issuance limits an operator can exhaust by cycling the stack.
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "80:80"
      - "443:443"

  # ── Telemetry sinks (optional; enable with COMPOSE_PROFILES=telemetry) ──────
  # Gives the dashboard real resource logs (Loki) and metrics (VictoriaMetrics
  # cluster — the CP's tenant-scoped /insert/<t>/… and /select/<t>/… paths need
  # the cluster layout, not the single binary). Wire the CP at them with:
  #   CP_LOKI_URL=http://loki:3100
  #   CP_VM_WRITE_URL=http://vminsert:8480
  #   CP_VM_READ_URL=http://vmselect:8481
  # Loki runs SigmaHub's own config, not the image's demo one (SIGMA-298). The
  # stock /etc/loki/local-config.yaml left auth_enabled false — so the CP's
  # X-Scope-OrgID tenancy was discarded and every customer's lines shared one
  # tenant — with no compactor and no retention_period, which meant customer log
  # lines were kept forever AND could not be deleted per tenant when a customer
  # asked for erasure. See loki/loki-config.yaml for the whole argument.
  loki:
    image: grafana/loki:2.9.8
    profiles: ["telemetry"]
    restart: unless-stopped
    logging: *default-logging
    command:
      - -config.file=/etc/loki/loki-config.yaml
      - -config.expand-env=true
    environment:
      # How long a tenant's log lines live before the compactor expires them.
      # Per-tenant exceptions go in loki/runtime-config.yaml.
      LOKI_RETENTION_PERIOD: ${CP_LOKI_RETENTION:-720h}
    volumes:
      - ./loki:/etc/loki:ro
      - loki-data:/loki

  vmstorage:
    image: victoriametrics/vmstorage:v1.102.1-cluster
    profiles: ["telemetry"]
    restart: unless-stopped
    logging: *default-logging
    # -retentionPeriod is stated explicitly rather than left to the image
    # default (1 month) for the same reason as Loki's: how long a customer's
    # telemetry is kept is a policy decision the deployment must make out loud.
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=${CP_VM_RETENTION:-90d}
    volumes:
      - vm-data:/storage

  vminsert:
    image: victoriametrics/vminsert:v1.102.1-cluster
    profiles: ["telemetry"]
    restart: unless-stopped
    logging: *default-logging
    command: ["-storageNode=vmstorage:8400"]
    depends_on:
      - vmstorage

  vmselect:
    image: victoriametrics/vmselect:v1.102.1-cluster
    profiles: ["telemetry"]
    restart: unless-stopped
    logging: *default-logging
    command: ["-storageNode=vmstorage:8401"]
    depends_on:
      - vmstorage

  # ── Operator monitoring (optional; enable with COMPOSE_PROFILES=monitoring) ──
  # The control plane's own health, scraped and alerted on (SIGMA-365).
  #
  # This is NOT the telemetry profile above. That one is the tenant pipeline —
  # customer logs and metrics. This one watches the control plane itself, and it
  # is deliberately a separate profile so it can run on a deployment that offers
  # no tenant telemetry at all, and keep working when the tenant pipeline is the
  # thing that broke.
  #
  # Until this existed, SIGMA-248's loop last-success clocks were exported and
  # scraped by nobody: every "the loop goes stale and we will know" guarantee
  # rested on alerting the docs described and the deployment never shipped. If
  # you run no monitoring at all, GET /livez on the CP is the zero-infrastructure
  # version — it answers 503 in the same state these rules page on, so any uptime
  # checker or orchestrator liveness probe catches it.
  vmsingle:
    image: victoriametrics/victoria-metrics:v1.102.1
    profiles: ["monitoring"]
    restart: unless-stopped
    logging: *default-logging
    command:
      - -promscrape.config=/etc/monitoring/scrape.yml
      - -retentionPeriod=${CP_MONITORING_RETENTION:-30d}
      - -storageDataPath=/storage
    volumes:
      - ./monitoring:/etc/monitoring:ro
      - monitoring-data:/storage

  vmalert:
    image: victoriametrics/vmalert:v1.102.1
    profiles: ["monitoring"]
    restart: unless-stopped
    logging: *default-logging
    command:
      - -rule=/etc/monitoring/alerts.yml
      - -datasource.url=http://vmsingle:8428
      # Where evaluated alerts go. Unset means they are still visible in
      # vmalert's own UI and as the ALERTS series, but nothing pages — point this
      # at an Alertmanager to have these reach a human.
      - -notifier.url=${CP_ALERTMANAGER_URL:-}
      # Recording the rules' own results back lets you graph them.
      - -remoteWrite.url=http://vmsingle:8428
    depends_on:
      - vmsingle

volumes:
  db-data:
  cp-data:
  caddy-data:
  caddy-config:
  loki-data:
  vm-data:
  monitoring-data:
