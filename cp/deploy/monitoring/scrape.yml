# What scrapes the control plane's own health (SIGMA-248 / SIGMA-365).
#
# The CP has exported loop last-success clocks, error counters and pool gauges
# since SIGMA-248, and staging.md has described the alert to build from them for
# just as long — but nothing in this deployment ever scraped them, so every
# guarantee of the form "the loop goes stale and we will know" was true only for
# an operator who had separately built the alerting the docs described. This file
# and the vmsingle/vmalert services in docker-compose.yml are that alerting,
# shipped, behind `COMPOSE_PROFILES=monitoring`.
#
# Deliberately independent of the `telemetry` profile: that stack is the TENANT
# pipeline (customer logs and metrics). The control plane's own health has to be
# observable on a deployment that has no tenant pipeline at all, and it has to
# keep working when the tenant pipeline is the thing that broke.

global:
  scrape_interval: 30s
  external_labels:
    component: sigmahub-cp

scrape_configs:
  - job_name: sigmahub-cp
    metrics_path: /metrics
    static_configs:
      - targets: ["cp:8080"]
