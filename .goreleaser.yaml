version: 2

project_name: sigmahub

# cp/ and agent/ are separate Go modules; each build runs in its own dir so it
# resolves against that module's go.mod.
builds:
  - id: sigmahub-cp
    dir: cp
    main: ./cmd/sigmahub-cp
    binary: sigmahub-cp
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{ .Version }}
  - id: sigmad
    dir: agent
    main: ./cmd/sigmad
    binary: sigmad
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: sigmahub-cp
    ids: [sigmahub-cp]
    name_template: "sigmahub-cp_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
  - id: sigmad
    ids: [sigmad]
    name_template: "sigmad_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"
  # The installer/units ship as extra release assets; hashing them here puts
  # them under the cosign-signed checksums.txt, closing the trust-chain gap
  # where extra_files were previously served unsigned.
  extra_files:
    - glob: ./agent/packaging/install.sh
    - glob: ./agent/packaging/uninstall.sh
    - glob: ./agent/packaging/sigmad.service
    - glob: ./cp/packaging/sigmahub-cp.service

# Software bill of materials per archive (syft).
sboms:
  - artifacts: archive

# Keyless signing via the ambient GitHub OIDC token (Fulcio + Rekor). The
# release job grants id-token: write; no long-lived keys.
signs:
  - cmd: cosign
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--yes"
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "${artifact}"
    artifacts: checksum
    output: true

release:
  prerelease: auto
  # Ship the P1-5 onboarding installer + systemd unit as release assets so the
  # connect-server wizard can point a host at a stable URL. install.sh itself is
  # served over HTTPS and cosign-verifies the sigmad binary it downloads.
  extra_files:
    - glob: ./agent/packaging/install.sh
    # The manual cleanup script the force-disconnect dialog hands out
    # (SIGMA-205). Shipped from the same file the dialog renders, so the copy
    # on the page and the copy on disk cannot drift.
    - glob: ./agent/packaging/uninstall.sh
    - glob: ./agent/packaging/sigmad.service
    # Control-plane self-hosting (bare-binary deployments; the container path
    # builds from cp/Dockerfile + cp/deploy/docker-compose.yml).
    - glob: ./cp/packaging/sigmahub-cp.service

changelog:
  disable: true
